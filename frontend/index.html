<!--
  React entry HTML:
  Provides a root container (#root) where the React app will be mounted.
  main.jsx loads and renders <App /> into this container.
-->

<!doctype html>
<!-- Use HTML5 standard -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <!-- Browser tab icon -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Makes layout responsive on mobile -->

    <!--
      Crawler metadata. This shell is served for every route, so these are the
      homepage's values and the fallback for everything else; each route
      overwrites them on render via src/components/SearchMetadata.jsx.
    -->
    <title>College Essay Examples &amp; Draft Comparison | Essay Annotator</title>
    <meta
      name="description"
      content="Explore college application essay examples and personal statements. Find essays similar to your draft and compare structure, storytelling, and reflection with Essay Annotator."
    />
    <link rel="canonical" href="https://essayannotator.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Essay Annotator" />
    <meta property="og:url" content="https://essayannotator.com/" />
    <meta property="og:title" content="College Essay Examples &amp; Draft Comparison | Essay Annotator" />
    <meta
      property="og:description"
      content="Explore college application essay examples and personal statements. Find essays similar to your draft and compare structure, storytelling, and reflection with Essay Annotator."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Lets Google show "Essay Annotator" as the site name above the URL. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Essay Annotator",
        "url": "https://essayannotator.com/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Load the React entry file (main.jsx) -->
  </body>
</html>
